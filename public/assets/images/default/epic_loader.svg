<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 30 265 135" width="530" height="270">
  <style>
    .p { transform-box: fill-box; transform-origin: center; opacity: 0;
         animation: pop .7s cubic-bezier(.2,.8,.2,1) forwards;
         animation-delay: calc(var(--i) * 0.25s + 0.2s); }
    .leaf { transform-box: fill-box; transform-origin: 0% 100%; opacity: 0;
            animation: grow .9s ease-out forwards; animation-delay: 1.4s; }
    @keyframes pop {
      0%   { opacity: 0; transform: scale(.6) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes grow {
      0%   { opacity: 0; transform: scale(.3) rotate(-25deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
  </style>

